<div class="container contact-page">
  <div class="contact-info glass-card">
    <h2>Get In Touch</h2>
    <p><strong>Email:</strong> {{ personalInfo.email }}</p>
    <p><strong>Phone:</strong> {{ personalInfo.phone }}</p>
    <p><strong>Location:</strong> {{ personalInfo.location }}</p>
    <p><strong>Reference:</strong> Paul Nyembo — Manager, CSD at Reliance Corporation | +27 82 677 4412</p>
  </div>
  <form #contactForm="ngForm" (ngSubmit)="onSubmit()" class="contact-form glass-card">
    <div class="form-group">
      <input type="text" id="name" name="name" [(ngModel)]="formData.name" required>
      <label for="name">Your Name</label>
    </div>
    <div class="form-group">
      <input type="email" id="email" name="email" [(ngModel)]="formData.email" required>
      <label for="email">Your Email</label>
    </div>
    <div class="form-group">
      <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="5"></textarea>
      <label for="message">Your Message</label>
    </div>
    <button type="submit" [disabled]="sending" class="btn primary">
      {{ sending ? 'Sending...' : 'Send Message' }}
    </button>
    <p *ngIf="successMsg" class="success">{{ successMsg }}</p>
    <p *ngIf="errorMsg" class="error">{{ errorMsg }}</p>
  </form>
</div>
