<div class="container">
  <p class="section-label">Career</p>
  <h2 class="page-title">Work Experience</h2>
  <div class="timeline">
    <div *ngFor="let job of workExperiences" class="timeline-item">
      <div class="timeline-header">
        <h3>
          <svg lucideBriefcase></svg>
          <span>{{ job.role }}</span>
        </h3>
        <span class="period">{{ job.period }}</span>
      </div>
      <div class="company">{{ job.company }} | {{ job.location }}</div>
      <ul class="plain-list">
        <li *ngFor="let ach of job.achievements">{{ ach }}</li>
      </ul>
    </div>
  </div>

  <h2 class="page-title">Education</h2>
  <div class="education-list">
    <div *ngFor="let edu of education" class="edu-item">
      <h3>
        <svg lucideGraduationCap></svg>
        <span>{{ edu.degree }}</span>
      </h3>
      <p>{{ edu.institution }} ({{ edu.year }})</p>
      <p>{{ edu.details }}</p>
    </div>
  </div>
</div>
