<!-- Hero Section -->
<section class="hero">
  <div class="container">
    <div class="hero-row">
      <img src="TM_Logo.png" alt="Thabang Mokgonyana logo" class="hero-logo" width="120" fetchpriority="high" decoding="async">
      <div class="hero-text">
        <p class="section-label">Portfolio</p>
        <h1>{{ personalInfo.name }}</h1>
        <p class="lead">{{ personalInfo.title }}</p>
        <p>{{ personalInfo.summary }}</p>
        <div class="cta-buttons">
          <a class="btn" [routerLink]="['/projects']">
            <svg lucideFolderOpen></svg>
            <span>View Projects</span>
          </a>
          <button class="btn secondary" (click)="downloadCV()">
            <svg lucideDownload></svg>
            <span>Download CV</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Core Competencies Section -->
<section class="competencies">
  <div class="container">
    <p class="section-label">Capabilities</p>
    <h2>Core Competencies</h2>
    <div class="chips">
      <span *ngFor="let skill of coreSkills" class="chip">{{ skill }}</span>
    </div>
  </div>
</section>
