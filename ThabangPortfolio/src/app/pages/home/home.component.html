<!-- Hero Section -->
<section class="hero">
  <div class="container">
    <!-- Logo and text side by side -->
    <div class="hero-row">
      <img src="TM_Logo.png" alt="Logo" class="hero-logo">
      <div class="hero-text">
        <h1>{{ personalInfo.name }}</h1>
        <p class="lead typing-text"></p>
        <p>{{ personalInfo.summary }}</p>
        <div class="cta-buttons">
          <a class="btn primary" [routerLink]="['/projects']">View Projects</a>
          <button class="btn secondary" (click)="downloadCV()">Download CV</button>
        </div>
      </div>
    </div>
    <!-- Decorative sphere (optional, positioned absolutely) -->
    <div class="tech-sphere"></div>
  </div>
</section>

<!-- Core Competencies Section -->
<section class="competencies fade-up">
  <div class="container">
    <h2>Core Competencies</h2>
    <div class="chips">
      <span *ngFor="let skill of coreSkills" class="chip">{{ skill }}</span>
    </div>
  </div>
</section>
