<div class="container">
  <h2>Technical Skills</h2>
  <div class="skills-groups">
    <div *ngFor="let group of skillGroups" class="skill-group glass-card fade-up">
      <h3>{{ group.category }}</h3>
      <div *ngFor="let skill of group.items" class="skill-item">
        <span>{{ skill }}</span>
        <div class="skill-bar-container">
          <div class="skill-bar" [style.width.%]="getSkillPercentage(skill)"></div>
        </div>
      </div>
    </div>
  </div>
</div>
